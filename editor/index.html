<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FF14 Cyberpunk Card Layout Editor</title>
<style>
:root{--bg:#050814;--panel:#0b1224;--panel2:#0e1830;--line:#27466c;--text:#e8f6ff;--muted:#8ca9bf;--cyan:#66e8ff;--violet:#b58cff;--danger:#ff778e;--ok:#71ffc7}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(circle at 15% 0,#101a36 0,#060912 48%,#02040a 100%);color:var(--text);font-family:Inter,"Noto Sans JP",system-ui,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}.topbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #1d3859;background:rgba(3,8,18,.94);backdrop-filter:blur(12px);flex-wrap:wrap}.brand{font-weight:800;letter-spacing:.08em;margin-right:8px}.brand b{color:var(--cyan)}.btn{border:1px solid #31577d;background:linear-gradient(#132642,#0b1729);color:var(--text);border-radius:7px;padding:8px 11px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)}.btn:hover{border-color:var(--cyan)}.btn.primary{border-color:#2fcbe7;background:linear-gradient(#0f6680,#0c3f57)}.btn.danger{border-color:#804151;color:#ffd8df}.sep{width:1px;height:28px;background:#29445f;margin:0 2px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:0}.stage-wrap{position:relative;min-width:0;min-height:0;overflow:auto;padding:22px;background-image:linear-gradient(45deg,#080d19 25%,transparent 25%),linear-gradient(-45deg,#080d19 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#080d19 75%),linear-gradient(-45deg,transparent 75%,#080d19 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}.stage-shell{position:relative;margin:auto;width:min(100%,1672px);aspect-ratio:1672/941;box-shadow:0 18px 70px #000,0 0 0 1px #263f5c;background:#020611}.stage-shell canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;left:10px;bottom:8px;padding:5px 8px;border:1px solid #244767;border-radius:5px;background:rgba(2,7,16,.75);font-size:12px;color:#a9c4d7;pointer-events:none}.sidebar{border-left:1px solid #203c5b;background:rgba(5,11,23,.97);overflow:auto;min-height:0}.section{border-bottom:1px solid #1b334d;padding:12px}.section h2{font-size:12px;letter-spacing:.13em;color:#9ac9e2;margin:0 0 10px;text-transform:uppercase}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:5px;margin-bottom:8px}.field label{font-size:11px;color:var(--muted)}.field input,.field select{width:100%;border:1px solid #284866;background:#07101f;color:var(--text);border-radius:6px;padding:7px 8px}.field input[type=color]{padding:2px;height:34px}.row{display:flex;gap:7px;align-items:center}.row>*{min-width:0}.check{display:flex;align-items:center;gap:7px;color:#b7cada;font-size:12px}.layers{display:grid;gap:6px}.layer{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:6px;padding:7px;border:1px solid #233f5d;border-radius:6px;background:#071221}.layer.selected{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(102,232,255,.16)}.layer button{padding:3px 6px;border:1px solid #294963;background:#0c1a2c;color:#cdefff;border-radius:4px}.layer-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.hint{font-size:11px;line-height:1.55;color:#7795aa}.status{margin-left:auto;font-size:12px;color:#8fb3ca}.kbd{display:inline-block;border:1px solid #3a5268;border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#0a1321;color:#d5eaff}.range-line{display:grid;grid-template-columns:1fr 50px;gap:8px;align-items:center}.range-line input[type=range]{width:100%}.mini{font-size:11px;padding:6px 8px}.swatch{width:22px;height:22px;border-radius:4px;border:1px solid #42617a}.footer-note{font-size:11px;line-height:1.6;color:#7492a7}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#0d2436;border:1px solid #4ccbe1;color:#e9fbff;padding:9px 14px;border-radius:7px;transition:.2s;z-index:10}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1000px){.workspace{grid-template-columns:1fr}.sidebar{border-left:0;border-top:1px solid #203c5b;max-height:52vh}.stage-wrap{min-height:55vh}.status{width:100%;margin-left:0}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><b>FF14</b> CYBERPUNK LAYOUT EDITOR</div>
    <button class="btn" id="newBtn">初期配置へ戻す</button>
    <button class="btn" id="undoBtn">元に戻す</button>
    <button class="btn" id="redoBtn">やり直す</button>
    <span class="sep"></span>
    <button class="btn" id="saveLocalBtn">ブラウザ保存</button>
    <button class="btn" id="loadLocalBtn">保存を読込</button>
    <button class="btn" id="exportJsonBtn">JSON書き出し</button>
    <label class="btn" for="importJsonInput">JSON読込</label><input hidden id="importJsonInput" type="file" accept="application/json,.json">
    <span class="sep"></span>
    <label class="btn" for="bgInput">参考画像を変更</label><input hidden id="bgInput" type="file" accept="image/*">
    <button class="btn primary" id="exportPngBtn">台紙PNG書き出し</button>
    <div class="status" id="status">1672 × 941 px</div>
  </header>

  <main class="workspace">
    <section class="stage-wrap">
      <div class="stage-shell" id="stageShell">
        <canvas id="canvas" width="1672" height="941"></canvas>
        <div class="hud" id="hud">選択なし</div>
      </div>
    </section>

    <aside class="sidebar">
      <section class="section">
        <h2>表示</h2>
        <label class="check"><input id="showReference" type="checkbox" checked> 元の台紙を参考表示</label>
        <div class="field" style="margin-top:8px"><label>参考画像の濃さ</label><div class="range-line"><input id="referenceOpacity" type="range" min="0" max="1" step="0.05" value="0.42"><output id="referenceOpacityOut">42%</output></div></div>
        <label class="check"><input id="showGrid" type="checkbox" checked> グリッド</label>
        <label class="check"><input id="snapGrid" type="checkbox" checked> 8px単位でスナップ</label>
        <label class="check"><input id="showGuides" type="checkbox" checked> 中央ガイド</label>
        <label class="check"><input id="includeReferenceExport" type="checkbox"> PNGへ参考画像も含める</label>
      </section>

      <section class="section">
        <h2>パーツ追加</h2>
        <div class="grid2">
          <button class="btn mini" data-add="cut">切り欠きパネル</button>
          <button class="btn mini" data-add="rect">四角パネル</button>
          <button class="btn mini" data-add="diagR">右斜めパネル</button>
          <button class="btn mini" data-add="outline">画像枠</button>
        </div>
      </section>

      <section class="section" id="propertiesSection">
        <h2>選択パーツ</h2>
        <div id="noSelection" class="hint">キャンバス上のパーツをクリックしてください。</div>
        <div id="properties" hidden>
          <div class="field"><label>名前</label><input id="pName"></div>
          <div class="field"><label>見出し文字</label><input id="pLabel"></div>
          <div class="grid2">
            <div class="field"><label>X</label><input id="pX" type="number"></div>
            <div class="field"><label>Y</label><input id="pY" type="number"></div>
            <div class="field"><label>幅</label><input id="pW" type="number" min="24"></div>
            <div class="field"><label>高さ</label><input id="pH" type="number" min="24"></div>
          </div>
          <div class="grid2">
            <div class="field"><label>形状</label><select id="pShape"><option value="cut">切り欠き</option><option value="rect">四角</option><option value="diagR">右斜め</option><option value="diagL">左斜め</option><option value="outline">画像枠</option></select></div>
            <div class="field"><label>切り欠き量</label><input id="pCut" type="number" min="0" max="160"></div>
          </div>
          <div class="grid2">
            <div class="field"><label>線色</label><input id="pStroke" type="color"></div>
            <div class="field"><label>塗り色</label><input id="pFill" type="color"></div>
            <div class="field"><label>線幅</label><input id="pLineWidth" type="number" min="1" max="20"></div>
            <div class="field"><label>塗り透明度</label><input id="pFillAlpha" type="number" min="0" max="1" step="0.05"></div>
          </div>
          <div class="grid2">
            <div class="field"><label>文字サイズ</label><input id="pFontSize" type="number" min="8" max="80"></div>
            <div class="field"><label>見出し余白</label><input id="pLabelPad" type="number" min="0" max="80"></div>
          </div>
          <label class="check"><input id="pGlow" type="checkbox"> 発光</label>
          <label class="check"><input id="pVisible" type="checkbox"> 表示</label>
          <label class="check"><input id="pLocked" type="checkbox"> ロック</label>
          <div class="row" style="margin-top:10px">
            <button class="btn mini" id="duplicateBtn">複製</button>
            <button class="btn mini" id="frontBtn">最前面</button>
            <button class="btn mini danger" id="deleteBtn">削除</button>
          </div>
        </div>
      </section>

      <section class="section">
        <h2>レイヤー</h2>
        <div class="layers" id="layers"></div>
      </section>

      <section class="section">
        <h2>操作</h2>
        <div class="hint">
          ドラッグ：移動<br>
          四隅のハンドル：サイズ変更<br>
          <span class="kbd">↑ ↓ ← →</span>：1px移動（Shiftで8px）<br>
          <span class="kbd">Delete</span>：削除　<span class="kbd">Ctrl+D</span>：複製<br>
          参考画像は編集されません。新しい枠を重ねて配置案を作るページです。
        </div>
      </section>
      <section class="section footer-note">書き出したJSONには、各欄のX・Y・幅・高さ・形状が含まれます。後でキャラクターカード本体の配置座標へ反映できます。</section>
    </aside>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
(() => {
'use strict';
const W=1672,H=941,GRID=8;
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const shell=document.getElementById('stageShell'),hud=document.getElementById('hud'),toast=document.getElementById('toast');
const reference=new Image(); reference.src='assets/card-template-reference.png'; reference.onload=draw;
const $=id=>document.getElementById(id);
const ui={showReference:$('showReference'),referenceOpacity:$('referenceOpacity'),referenceOpacityOut:$('referenceOpacityOut'),showGrid:$('showGrid'),snapGrid:$('snapGrid'),showGuides:$('showGuides'),includeReferenceExport:$('includeReferenceExport')};
let nextId=20, selectedId=null, action=null, history=[],future=[];
const clone=o=>JSON.parse(JSON.stringify(o));
let elements=[
{id:1,name:'メインジョブ',label:'',x:45,y:45,w:205,h:205,shape:'cut',cut:24,stroke:'#a68cff',fill:'#08132a',fillAlpha:.48,lineWidth:3,fontSize:24,labelPad:18,glow:true,visible:true,locked:false},
{id:2,name:'情報欄1',label:'',x:269,y:45,w:270,h:58,shape:'cut',cut:13,stroke:'#56dfff',fill:'#08132a',fillAlpha:.46,lineWidth:2,fontSize:20,labelPad:15,glow:true,visible:true,locked:false},
{id:3,name:'情報欄2',label:'',x:269,y:114,w:270,h:58,shape:'cut',cut:13,stroke:'#56dfff',fill:'#08132a',fillAlpha:.46,lineWidth:2,fontSize:20,labelPad:15,glow:true,visible:true,locked:false},
{id:4,name:'情報欄3',label:'',x:269,y:183,w:270,h:58,shape:'cut',cut:13,stroke:'#56dfff',fill:'#08132a',fillAlpha:.46,lineWidth:2,fontSize:20,labelPad:15,glow:true,visible:true,locked:false},
{id:5,name:'PLAY STYLE',label:'PLAY STYLE',x:45,y:275,w:500,h:555,shape:'diagR',cut:90,stroke:'#b690ff',fill:'#08132a',fillAlpha:.40,lineWidth:3,fontSize:25,labelPad:18,glow:true,visible:true,locked:false},
{id:6,name:'キャラクター画像',label:'',x:575,y:45,w:500,h:785,shape:'outline',cut:28,stroke:'#78ddff',fill:'#020713',fillAlpha:.16,lineWidth:3,fontSize:22,labelPad:18,glow:true,visible:true,locked:false},
{id:7,name:'JOB',label:'JOB',x:1108,y:45,w:515,h:500,shape:'cut',cut:28,stroke:'#ad8fff',fill:'#08132a',fillAlpha:.40,lineWidth:3,fontSize:26,labelPad:20,glow:true,visible:true,locked:false},
{id:8,name:'PLAY TIME',label:'PLAY TIME',x:1108,y:575,w:515,h:255,shape:'cut',cut:28,stroke:'#65eaff',fill:'#08132a',fillAlpha:.40,lineWidth:3,fontSize:26,labelPad:20,glow:true,visible:true,locked:false},
{id:9,name:'フッター',label:'',x:45,y:850,w:1578,h:55,shape:'cut',cut:18,stroke:'#62ddff',fill:'#08132a',fillAlpha:.42,lineWidth:2,fontSize:20,labelPad:14,glow:true,visible:true,locked:false}
];
function snap(v){return ui.snapGrid.checked?Math.round(v/GRID)*GRID:Math.round(v)}
function selected(){return elements.find(e=>e.id===selectedId)||null}
function pushHistory(){history.push(clone(elements));if(history.length>60)history.shift();future=[];updateUndoButtons()}
function updateUndoButtons(){$('undoBtn').disabled=!history.length;$('redoBtn').disabled=!future.length}
function pathFor(e,c=ctx){const{x,y,w,h}=e,k=Math.min(e.cut||0,w/3,h/3);c.beginPath();switch(e.shape){case'rect':c.rect(x,y,w,h);break;case'diagR':c.moveTo(x,y);c.lineTo(x+w-k,y);c.lineTo(x+w,y+k);c.lineTo(x+w,y+h);c.lineTo(x+k,y+h);c.lineTo(x,y+h-k);c.closePath();break;case'diagL':c.moveTo(x+k,y);c.lineTo(x+w,y);c.lineTo(x+w,y+h-k);c.lineTo(x+w-k,y+h);c.lineTo(x,y+h);c.lineTo(x,y+k);c.closePath();break;default:c.moveTo(x+k,y);c.lineTo(x+w-k,y);c.lineTo(x+w,y+k);c.lineTo(x+w,y+h-k);c.lineTo(x+w-k,y+h);c.lineTo(x+k,y+h);c.lineTo(x,y+h-k);c.lineTo(x,y+k);c.closePath()}}
function hexToRgba(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function drawBackground(c,includeRef=true){c.clearRect(0,0,W,H);c.fillStyle='#020713';c.fillRect(0,0,W,H);const g=c.createRadialGradient(W*.48,H*.42,40,W*.48,H*.42,W*.72);g.addColorStop(0,'#101936');g.addColorStop(.55,'#071020');g.addColorStop(1,'#02050c');c.fillStyle=g;c.fillRect(0,0,W,H);if(includeRef&&ui.showReference.checked&&reference.complete){c.save();c.globalAlpha=Number(ui.referenceOpacity.value);c.drawImage(reference,0,0,W,H);c.restore()}}
function drawGrid(){if(!ui.showGrid.checked)return;ctx.save();ctx.strokeStyle='rgba(110,194,235,.12)';ctx.lineWidth=1;for(let x=0;x<=W;x+=GRID*4){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<=H;y+=GRID*4){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore()}
function drawGuides(){if(!ui.showGuides.checked)return;ctx.save();ctx.setLineDash([10,10]);ctx.strokeStyle='rgba(255,255,255,.32)';ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();ctx.restore()}
function drawElement(e,c=ctx,selectedState=false){if(!e.visible)return;c.save();pathFor(e,c);if(e.shape==='outline'){c.fillStyle=hexToRgba(e.fill,.08);c.fill();}else{c.fillStyle=hexToRgba(e.fill,e.fillAlpha);c.fill()}if(e.glow){c.shadowColor=e.stroke;c.shadowBlur=12}c.strokeStyle=e.stroke;c.lineWidth=e.lineWidth;c.stroke();c.shadowBlur=0;c.globalAlpha=.65;c.lineWidth=Math.max(1,e.lineWidth*.45);c.strokeStyle='#e9fbff';c.stroke();c.globalAlpha=1;if(e.label){c.font=`700 ${e.fontSize}px Inter, sans-serif`;c.fillStyle='#dffaff';c.textBaseline='top';c.shadowColor=e.stroke;c.shadowBlur=e.glow?8:0;c.fillText(e.label,e.x+e.labelPad,e.y+e.labelPad);c.shadowBlur=0}if(selectedState){c.setLineDash([9,6]);c.lineWidth=2;c.strokeStyle='#ffffff';pathFor(e,c);c.stroke();drawHandles(e,c)}c.restore()}
function drawHandles(e,c){const s=12;for(const [x,y] of [[e.x,e.y],[e.x+e.w,e.y],[e.x+e.w,e.y+e.h],[e.x,e.y+e.h]]){c.fillStyle='#06111e';c.fillRect(x-s/2,y-s/2,s,s);c.strokeStyle='#73efff';c.strokeRect(x-s/2,y-s/2,s,s)}}
function draw(){drawBackground(ctx,true);drawGrid();drawGuides();for(const e of elements)drawElement(e,ctx,e.id===selectedId);const e=selected();hud.textContent=e?`${e.name}  X:${e.x}  Y:${e.y}  W:${e.w}  H:${e.h}`:'選択なし';renderLayers();renderProps()}
function canvasPoint(ev){const r=canvas.getBoundingClientRect();return{x:(ev.clientX-r.left)*W/r.width,y:(ev.clientY-r.top)*H/r.height}}
function pointIn(e,p){ctx.save();pathFor(e,ctx);const hit=ctx.isPointInPath(p.x,p.y);ctx.restore();return hit}
function handleAt(e,p){const d=18;const hs=[['nw',e.x,e.y],['ne',e.x+e.w,e.y],['se',e.x+e.w,e.y+e.h],['sw',e.x,e.y+e.h]];for(const [n,x,y] of hs)if(Math.abs(p.x-x)<=d&&Math.abs(p.y-y)<=d)return n;return null}
canvas.addEventListener('pointerdown',ev=>{const p=canvasPoint(ev);const cur=selected();if(cur&&!cur.locked){const h=handleAt(cur,p);if(h){pushHistory();action={type:'resize',handle:h,start:p,orig:clone(cur)};canvas.setPointerCapture(ev.pointerId);return}}
let hit=null;for(let i=elements.length-1;i>=0;i--){if(elements[i].visible&&pointIn(elements[i],p)){hit=elements[i];break}}selectedId=hit?.id??null;if(hit&&!hit.locked){pushHistory();action={type:'move',start:p,orig:clone(hit)}}draw();canvas.setPointerCapture(ev.pointerId)});
canvas.addEventListener('pointermove',ev=>{if(!action)return;const p=canvasPoint(ev),e=selected();if(!e)return;const dx=p.x-action.start.x,dy=p.y-action.start.y,o=action.orig;if(action.type==='move'){e.x=snap(Math.max(0,Math.min(W-e.w,o.x+dx)));e.y=snap(Math.max(0,Math.min(H-e.h,o.y+dy)))}else{let x=o.x,y=o.y,w=o.w,h=o.h;if(action.handle.includes('e'))w=Math.max(24,o.w+dx);if(action.handle.includes('s'))h=Math.max(24,o.h+dy);if(action.handle.includes('w')){x=o.x+dx;w=o.w-dx}if(action.handle.includes('n')){y=o.y+dy;h=o.h-dy}if(w<24){if(action.handle.includes('w'))x=o.x+o.w-24;w=24}if(h<24){if(action.handle.includes('n'))y=o.y+o.h-24;h=24}e.x=snap(Math.max(0,x));e.y=snap(Math.max(0,y));e.w=snap(Math.min(W-e.x,w));e.h=snap(Math.min(H-e.y,h))}draw()});
canvas.addEventListener('pointerup',()=>{action=null});canvas.addEventListener('pointercancel',()=>{action=null});
function renderLayers(){const box=$('layers');box.innerHTML='';[...elements].reverse().forEach(e=>{const row=document.createElement('div');row.className='layer'+(e.id===selectedId?' selected':'');row.innerHTML=`<button title="表示">${e.visible?'◉':'○'}</button><button title="ロック">${e.locked?'🔒':'◇'}</button><div class="layer-name"></div><button title="前へ">↑</button>`;row.querySelector('.layer-name').textContent=e.name;const [vis,lock,,up]=row.children;vis.onclick=()=>{pushHistory();e.visible=!e.visible;draw()};lock.onclick=()=>{pushHistory();e.locked=!e.locked;draw()};row.querySelector('.layer-name').onclick=()=>{selectedId=e.id;draw()};up.onclick=()=>{pushHistory();const i=elements.indexOf(e);if(i<elements.length-1){elements.splice(i,1);elements.splice(i+1,0,e)}draw()};box.appendChild(row)})}
const propIds=['pName','pLabel','pX','pY','pW','pH','pShape','pCut','pStroke','pFill','pLineWidth','pFillAlpha','pFontSize','pLabelPad','pGlow','pVisible','pLocked'];
function renderProps(){const e=selected();$('noSelection').hidden=!!e;$('properties').hidden=!e;if(!e)return;const map={pName:'name',pLabel:'label',pX:'x',pY:'y',pW:'w',pH:'h',pShape:'shape',pCut:'cut',pStroke:'stroke',pFill:'fill',pLineWidth:'lineWidth',pFillAlpha:'fillAlpha',pFontSize:'fontSize',pLabelPad:'labelPad',pGlow:'glow',pVisible:'visible',pLocked:'locked'};for(const [id,key] of Object.entries(map)){const el=$(id);if(document.activeElement===el)continue;if(el.type==='checkbox')el.checked=!!e[key];else el.value=e[key]}}
for(const id of propIds){$(id).addEventListener('change',ev=>{const e=selected();if(!e)return;pushHistory();const key={pName:'name',pLabel:'label',pX:'x',pY:'y',pW:'w',pH:'h',pShape:'shape',pCut:'cut',pStroke:'stroke',pFill:'fill',pLineWidth:'lineWidth',pFillAlpha:'fillAlpha',pFontSize:'fontSize',pLabelPad:'labelPad',pGlow:'glow',pVisible:'visible',pLocked:'locked'}[id];e[key]=ev.target.type==='checkbox'?ev.target.checked:(ev.target.type==='number'?Number(ev.target.value):ev.target.value);if(['x','y','w','h','cut'].includes(key))e[key]=snap(e[key]);draw()})}
function addElement(shape){pushHistory();const e={id:nextId++,name:'新しいパーツ',label:'',x:W/2-160,y:H/2-90,w:320,h:180,shape,cut:24,stroke:'#67e8ff',fill:'#08132a',fillAlpha:.42,lineWidth:3,fontSize:24,labelPad:18,glow:true,visible:true,locked:false};elements.push(e);selectedId=e.id;draw()}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addElement(b.dataset.add));
function duplicate(){const e=selected();if(!e)return;pushHistory();const n=clone(e);n.id=nextId++;n.name=e.name+' コピー';n.x=Math.min(W-n.w,n.x+24);n.y=Math.min(H-n.h,n.y+24);elements.push(n);selectedId=n.id;draw()}
function removeSelected(){const i=elements.findIndex(e=>e.id===selectedId);if(i<0)return;pushHistory();elements.splice(i,1);selectedId=null;draw()}
$('duplicateBtn').onclick=duplicate;$('deleteBtn').onclick=removeSelected;$('frontBtn').onclick=()=>{const e=selected();if(!e)return;pushHistory();elements=elements.filter(x=>x.id!==e.id);elements.push(e);draw()};
window.addEventListener('keydown',ev=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;const e=selected();if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='d'){ev.preventDefault();duplicate();return}if(ev.key==='Delete'){removeSelected();return}if(e&&!e.locked&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(ev.key)){ev.preventDefault();pushHistory();const d=ev.shiftKey?8:1;if(ev.key==='ArrowUp')e.y=Math.max(0,e.y-d);if(ev.key==='ArrowDown')e.y=Math.min(H-e.h,e.y+d);if(ev.key==='ArrowLeft')e.x=Math.max(0,e.x-d);if(ev.key==='ArrowRight')e.x=Math.min(W-e.w,e.x+d);draw()}if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'){ev.preventDefault();ev.shiftKey?redo():undo()}});
function undo(){if(!history.length)return;future.push(clone(elements));elements=history.pop();selectedId=null;draw();updateUndoButtons()}function redo(){if(!future.length)return;history.push(clone(elements));elements=future.pop();selectedId=null;draw();updateUndoButtons()}$('undoBtn').onclick=undo;$('redoBtn').onclick=redo;
function project(){return{version:1,canvas:{width:W,height:H},elements:clone(elements)}}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('exportJsonBtn').onclick=()=>downloadBlob(new Blob([JSON.stringify(project(),null,2)],{type:'application/json'}),'cyberpunk-card-layout.json');
$('importJsonInput').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.elements))throw Error();pushHistory();elements=data.elements;nextId=Math.max(20,...elements.map(e=>e.id+1));selectedId=null;draw();notice('JSONを読み込みました')}catch{alert('このJSONは読み込めませんでした。')}ev.target.value=''};
$('saveLocalBtn').onclick=()=>{localStorage.setItem('ff14CyberLayout',JSON.stringify(project()));notice('ブラウザへ保存しました')};$('loadLocalBtn').onclick=()=>{const s=localStorage.getItem('ff14CyberLayout');if(!s)return alert('保存データがありません。');try{pushHistory();const d=JSON.parse(s);elements=d.elements;nextId=Math.max(20,...elements.map(e=>e.id+1));selectedId=null;draw();notice('保存データを読み込みました')}catch{alert('保存データを読み込めませんでした。')}};
$('newBtn').onclick=()=>{if(!confirm('現在の配置を破棄して初期配置へ戻しますか？'))return;location.reload()};
$('bgInput').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const url=URL.createObjectURL(f);reference.onload=()=>{draw();URL.revokeObjectURL(url)};reference.src=url;ev.target.value=''};
$('exportPngBtn').onclick=()=>{const out=document.createElement('canvas');out.width=W;out.height=H;const c=out.getContext('2d');drawBackground(c,ui.includeReferenceExport.checked);for(const e of elements)drawElement(e,c,false);out.toBlob(b=>downloadBlob(b,'cyberpunk-card-template.png'),'image/png')};
function notice(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}
Object.values(ui).forEach(el=>el.addEventListener('input',()=>{ui.referenceOpacityOut.value=Math.round(ui.referenceOpacity.value*100)+'%';draw()}));
updateUndoButtons();draw();
})();
</script>
</body>
</html>
