<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF14 Cyberpunk Character Card Generator</title>
<style>
:root{color-scheme:dark;--bg:#03040b;--panel:#090c1b;--line:#645cff;--cyan:#22d7ff;--pink:#df42ff;--text:#f3f6ff;--muted:#aab2d4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,rgba(84,38,162,.2),transparent 34rem),radial-gradient(circle at 85% 8%,rgba(0,145,255,.15),transparent 38rem),var(--bg);color:var(--text);font-family:"Segoe UI","Noto Sans JP",sans-serif}button,input,select{font:inherit}.app{width:min(1780px,100%);margin:auto;padding:22px}.title{margin:0 0 5px;font-size:clamp(22px,2vw,32px);letter-spacing:.06em}.lead{margin:0 0 18px;color:var(--muted)}.preview-shell{border:1px solid rgba(105,96,255,.48);background:#000;box-shadow:0 0 34px rgba(65,55,255,.18);overflow:hidden}#cardCanvas{display:block;width:100%;height:auto;aspect-ratio:1672/941;touch-action:none;cursor:grab}#cardCanvas.dragging{cursor:grabbing}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px}button,.file-button{border:1px solid rgba(72,209,255,.55);background:linear-gradient(180deg,rgba(23,36,76,.96),rgba(8,12,30,.96));color:#fff;padding:10px 14px;border-radius:6px;cursor:pointer}.file-button input{display:none}button:hover,.file-button:hover{border-color:#aa66ff;box-shadow:0 0 14px rgba(120,70,255,.25)}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}fieldset{min-width:0;margin:0;padding:16px;border:1px solid rgba(100,83,255,.4);border-radius:8px;background:linear-gradient(180deg,rgba(12,14,35,.97),rgba(6,8,21,.97))}legend{padding:0 9px;color:#e5e8ff;letter-spacing:.08em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form{display:grid;gap:6px;color:#cfd4f0;font-size:14px}.full{grid-column:1/-1}input[type=text],select{width:100%;border:1px solid rgba(107,94,255,.38);border-radius:5px;background:#07091a;color:#fff;padding:9px 10px;outline:none}input[type=text]:focus,select:focus{border-color:#27cfff;box-shadow:0 0 0 2px rgba(39,207,255,.1)}.range-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}input[type=range]{width:100%}.check-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.check{display:flex;align-items:center;gap:7px;min-width:0;padding:7px 8px;border:1px solid rgba(108,93,255,.22);border-radius:5px;background:rgba(7,9,28,.82);font-size:13px}.check span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.subheading{margin:14px 0 8px;color:#aeb7e8;font-size:13px;letter-spacing:.08em}.selected-list{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:10px;border:1px dashed rgba(71,203,255,.35);border-radius:6px;background:rgba(3,5,17,.7)}.tag-chip{padding:7px 10px;border:1px solid rgba(96,207,255,.5);background:#0c1430;border-radius:4px;cursor:grab;user-select:none}.tag-chip.dragging{opacity:.45}.note{font-size:12px;color:var(--muted);margin:8px 0 0}.span-2{grid-column:1/-1}@media(max-width:1050px){.controls{grid-template-columns:1fr}.check-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.span-2{grid-column:auto}}@media(max-width:650px){.app{padding:12px}.grid{grid-template-columns:1fr}.check-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
<h1 class="title">FF14 CYBERPUNK CHARACTER CARD</h1>
<p class="lead">画像・ジョブ・プレイスタイル・各種情報を設定し、完成カードをPNGで保存します。</p>
<div class="preview-shell"><canvas id="cardCanvas" width="1672" height="941" aria-label="キャラクターカードプレビュー"></canvas></div>
<div class="toolbar"><label class="file-button">キャラクター画像を選択<input id="characterFile" type="file" accept="image/*"></label><button id="resetCharacter" type="button">画像位置をリセット</button><button id="downloadPng" type="button">PNG保存</button></div>
<div class="controls">
<fieldset><legend>キャラクター画像</legend><div class="grid"><label class="form full">拡大率<div class="range-row"><input id="characterScale" type="range" min="0.3" max="5" step="0.01" value="1"><output id="scaleOutput">100%</output></div></label><label class="form full">明るさ<div class="range-row"><input id="characterBrightness" type="range" min="40" max="160" step="1" value="100"><output id="brightnessOutput">100%</output></div></label></div><p class="note">プレビューの中央画像をドラッグして位置調整できます。画像上でマウスホイールを回すと拡大・縮小できます。</p></fieldset>
<fieldset><legend>人物情報</legend><div class="grid"><label class="form">種族<select id="race"><option value="">未選択</option></select></label><label class="form">グランドカンパニー<select id="grandCompany"><option value="">未選択</option></select></label><label class="form full">拠点（よくいるマップ）<select id="baseMap"><option value="">未選択</option></select></label></div></fieldset>
<fieldset class="span-2"><legend>JOB</legend><div class="grid" style="margin-bottom:12px"><label class="form">メインジョブ<select id="mainJob"><option value="">未選択</option></select></label></div><div id="jobChecks" class="check-grid"></div><p class="note">選択順を保持します。メインジョブは中央に大きく表示され、周囲の一覧からは自動的に除外されます。</p></fieldset>
<fieldset class="span-2"><legend>PLAY STYLE</legend><div id="playStyleChecks" class="check-grid"></div><div class="subheading">表示順（ドラッグで並べ替え）</div><div id="selectedPlayStyles" class="selected-list"></div></fieldset>
<fieldset><legend>進行度・PLAY TIME</legend><div class="grid"><label class="form full">進行度<select id="progress"><option value="">未選択</option></select></label><label class="form">時間帯<select id="playTime"><option value="">未選択</option></select></label><label class="form">ログイン傾向<select id="loginTrend"><option value="">未選択</option></select></label></div></fieldset>
<fieldset><legend>フッター</legend><div class="grid"><label class="form">HOME WORLD<select id="homeWorld"><option value="">DCを先に選択</option></select></label><label class="form">DC<select id="dataCenter"><option value="">未選択</option></select></label><label class="form full">作者表記<input id="creator" type="text" maxlength="50" value="Created by 鱗の旅人"></label><label class="form full">権利表記<input id="copyright" type="text" maxlength="60" value="FINAL FANTASY XIV © SQUARE ENIX"></label></div></fieldset>
</div></div>

const A={character:{x:594,y:54,w:500,h:746},info:[{x:267,y:39,w:235,h:43},{x:45,y:116,w:251,h:42},{x:254,y:187,w:248,h:43}],playStyle:{x:45,y:321,w:521,h:487},job:{x:1147,y:87,w:475,h:446},progress:{x:1174,y:580,w:414,h:48},playTime1:{x:1227,y:717,w:345,h:31},playTime2:{x:1227,y:764,w:345,h:31},homeWorld:{x:67,y:865,w:365,h:35},dc:{x:465,y:865,w:240,h:35},credit:{x:735,y:854,w:864,h:53}};
const state={character:null,characterX:0,characterY:0,characterScale:1,brightness:100,selectedJobs:[],selectedStyles:[],mainJob:'',dragStyle:null};
const cache=new Map(),tags={};
function loadImage(src){if(cache.has(src))return cache.get(src);const p=new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('画像を読み込めませんでした: '+src));i.src=src});cache.set(src,p);return p}
async function preload(){await Promise.all(JOBS.map(([s])=>loadImage(`assets/job-icons/${s}.png`).catch(()=>null)));for(const n of ['left','center','right','left-active','center-active','right-active','accent-left','accent-right'])tags[n]=await loadImage(`assets/tags/tag-${n}.png`)}
function fitScale(img,a){return Math.max(a.w/img.width,a.h/img.height)}
function resetCharacter(){if(!state.character)return;state.characterScale=fitScale(state.character,A.character);state.characterX=A.character.x+A.character.w/2;state.characterY=A.character.y+A.character.h/2;el.characterScale.value=state.characterScale;updateOutputs();draw()}
function displayValue(group,value){return (DISPLAY_MAPS[group]&&DISPLAY_MAPS[group][value])||value}
function drawCharacter(){if(!state.character)return;const a=A.character,dw=state.character.width*state.characterScale,dh=state.character.height*state.characterScale;ctx.save();ctx.beginPath();ctx.rect(a.x,a.y,a.w,a.h);ctx.clip();ctx.filter=`brightness(${state.brightness}%)`;ctx.drawImage(state.character,state.characterX-dw/2,state.characterY-dh/2,dw,dh);ctx.restore()}
function fittedText(text,a,o={}){if(!text)return;const max=o.max||22,min=o.min||10,pad=o.pad||8,align=o.align||'left';ctx.save();let size=max;ctx.font=`600 ${size}px "Segoe UI","Noto Sans JP",sans-serif`;while(size>min&&ctx.measureText(text).width>a.w-pad*2){size--;ctx.font=`600 ${size}px "Segoe UI","Noto Sans JP",sans-serif`}ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=o.color||'#eef6ff';ctx.shadowColor=o.shadow||'rgba(54,181,255,.8)';ctx.shadowBlur=o.shadowBlur??6;const x=align==='center'?a.x+a.w/2:align==='right'?a.x+a.w-pad:a.x+pad;ctx.fillText(text,x,a.y+a.h/2);ctx.restore()}
function iconFrame(x,y,s,main=false){ctx.save();ctx.strokeStyle=main?'rgba(106,223,255,.7)':'rgba(87,124,255,.48)';ctx.lineWidth=main?2:1;ctx.shadowColor=main?'rgba(40,206,255,.65)':'rgba(111,61,255,.45)';ctx.shadowBlur=main?10:5;const c=Math.max(5,s*.13);ctx.beginPath();ctx.moveTo(x+c,y);ctx.lineTo(x+s-c,y);ctx.lineTo(x+s,y+c);ctx.lineTo(x+s,y+s-c);ctx.lineTo(x+s-c,y+s);ctx.lineTo(x+c,y+s);ctx.lineTo(x,y+s-c);ctx.lineTo(x,y+c);ctx.closePath();ctx.stroke();ctx.restore()}
const JOB_CENTER={x:1402,y:289};
function ringPositions(count,a){if(!count)return[];const cx=JOB_CENTER.x,cy=JOB_CENTER.y;const rings=count<=8?[count]:count<=20?[8,count-8]:[8,12,count-20];const radii=count<=8?[[a.w*.25,a.h*.25]]:count<=20?[[a.w*.20,a.h*.20],[a.w*.39,a.h*.39]]:[[a.w*.18,a.h*.18],[a.w*.31,a.h*.31],[a.w*.43,a.h*.43]];const out=[];rings.forEach((n,r)=>{if(n<=0)return;const [rx,ry]=radii[r];const start=-Math.PI/2;for(let i=0;i<n;i++){const t=start+i*Math.PI*2/n;out.push({x:cx+Math.cos(t)*rx,y:cy+Math.sin(t)*ry})}});return out}
async function drawJobs(){const jobs=state.selectedJobs.filter(s=>s!==state.mainJob);if(!jobs.length)return;const a=A.job,positions=ringPositions(jobs.length,a);let size=jobs.length<=8?62:jobs.length<=20?52:jobs.length<=32?45:40;if(jobs.length>40)size=36;for(let i=0;i<jobs.length;i++){const img=await loadImage(`assets/job-icons/${jobs[i]}.png`).catch(()=>null);if(!img)continue;const p=positions[i],x=p.x-size/2,y=p.y-size/2;iconFrame(x,y,size,false);const pad=size*.13;ctx.save();ctx.shadowColor='rgba(63,128,255,.55)';ctx.shadowBlur=6;ctx.drawImage(img,x+pad,y+pad,size-pad*2,size-pad*2);ctx.restore()}}
async function drawMain(){if(!state.mainJob)return;const img=await loadImage(`assets/job-icons/${state.mainJob}.png`).catch(()=>null);if(!img)return;const s=112,x=JOB_CENTER.x-s/2,y=JOB_CENTER.y-s/2;iconFrame(x,y,s,true);const pad=s*.12;ctx.save();ctx.shadowColor='rgba(60,206,255,.8)';ctx.shadowBlur=15;ctx.drawImage(img,x+pad,y+pad,s-pad*2,s-pad*2);ctx.restore()}
function styleRightEdge(y,h){const a=A.playStyle,top=a.y,right=a.x+a.w,bottom=a.y+a.h;if(y+h<top+35)return right-105;if(y<top+110)return right-55;if(y>bottom-90)return right-40;return right-10}
function measureTag(text,fs,h){ctx.save();ctx.font=`600 ${fs}px "Segoe UI","Noto Sans JP",sans-serif`;const w=Math.ceil(ctx.measureText(text).width)+Math.max(28,h*.95);ctx.restore();return Math.max(h*2.05,Math.min(245,w))}
function styleLayout(items,c){const a=A.playStyle,placed=[];let x=a.x,y=a.y;for(const text of items){const w=measureTag(text,c.fs,c.h);let right=styleRightEdge(y,c.h);if(x+w>right){x=a.x;y+=c.h+c.gy;right=styleRightEdge(y,c.h)}if(y+c.h>a.y+a.h||x+w>right)return null;placed.push({text,x,y,w});x+=w+c.gx}return placed}
function chooseStyle(items){const cs=[{h:38,fs:17,gx:8,gy:8},{h:35,fs:16,gx:7,gy:7},{h:32,fs:15,gx:6,gy:6},{h:29,fs:14,gx:5,gy:5},{h:27,fs:13,gx:5,gy:4},{h:25,fs:12,gx:4,gy:4},{h:23,fs:11,gx:4,gy:3}];for(const c of cs){const p=styleLayout(items,c);if(p)return{p,c}}return{p:[],c:cs.at(-1)}}
function drawTag(text,x,y,w,c){const h=c.h,lw=Math.round(h*.7),rw=lw;ctx.drawImage(tags.left,x,y,lw,h);ctx.drawImage(tags.center,x+lw,y,Math.max(1,w-lw-rw),h);ctx.drawImage(tags.right,x+w-rw,y,rw,h);ctx.save();ctx.font=`600 ${c.fs}px "Segoe UI","Noto Sans JP",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#f1f6ff';ctx.shadowColor='rgba(80,180,255,.8)';ctx.shadowBlur=Math.max(4,h*.17);let out=text,limit=w-Math.max(24,h*.8);while(ctx.measureText(out).width>limit&&out.length>2)out=out.slice(0,-2)+'…';ctx.fillText(out,x+w/2,y+h/2+.5);ctx.restore()}
function drawStyles(){const {p,c}=chooseStyle(state.selectedStyles);p.forEach(v=>drawTag(v.text,v.x,v.y,v.w,c))}
let token=0;async function draw(){const t=++token;ctx.clearRect(0,0,W,H);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);if(template.complete)ctx.drawImage(template,0,0,W,H);drawCharacter();await drawMain();await drawJobs();if(t!==token)return;drawStyles();fittedText(displayValue('race',el.race.value),A.info[0],{max:20});fittedText(displayValue('grandCompany',el.grandCompany.value),A.info[1],{max:19});fittedText(displayValue('baseMap',el.baseMap.value),A.info[2],{max:19});fittedText(displayValue('progress',el.progress.value),A.progress,{max:20,align:'center'});fittedText(displayValue('playTime',el.playTime.value),A.playTime1,{max:17,align:'center'});fittedText(displayValue('loginTrend',el.loginTrend.value),A.playTime2,{max:17,align:'center'});fittedText(el.homeWorld.value,A.homeWorld,{max:19});fittedText(el.dataCenter.value,A.dc,{max:19});const c1=el.creator.value,c2=el.copyright.value;ctx.save();ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle='rgba(225,231,255,.86)';ctx.shadowColor='rgba(70,145,255,.45)';ctx.shadowBlur=4;ctx.font='13px "Segoe UI","Noto Sans JP",sans-serif';if(c1)ctx.fillText(c1,A.credit.x+A.credit.w,A.credit.y+16);if(c2)ctx.fillText(c2,A.credit.x+A.credit.w,A.credit.y+36);ctx.restore()}
function fillSelect(select,items,emptyLabel='未選択'){select.innerHTML='';const empty=document.createElement('option');empty.value='';empty.textContent=emptyLabel;select.append(empty);items.forEach(value=>{const option=document.createElement('option');option.value=value;option.textContent=value;select.append(option)})}
function updateWorldOptions(){const dc=el.dataCenter.value,current=el.homeWorld.value;fillSelect(el.homeWorld,DATA_CENTERS[dc]||[],dc?'未選択':'DCを先に選択');if((DATA_CENTERS[dc]||[]).includes(current))el.homeWorld.value=current;draw()}
function buildProfileSelects(){fillSelect(el.race,PROFILE_OPTIONS.race);fillSelect(el.grandCompany,PROFILE_OPTIONS.grandCompany);fillSelect(el.baseMap,PROFILE_OPTIONS.baseMap);fillSelect(el.progress,PROFILE_OPTIONS.progress);fillSelect(el.playTime,PROFILE_OPTIONS.playTime);fillSelect(el.loginTrend,PROFILE_OPTIONS.loginTrend);fillSelect(el.dataCenter,Object.keys(DATA_CENTERS));updateWorldOptions()}
function build(){buildProfileSelects();const main=el.mainJob,host=el.jobChecks;JOBS.forEach(([slug,name])=>{main.insertAdjacentHTML('beforeend',`<option value="${slug}">${name}</option>`);const l=document.createElement('label');l.className='check';l.innerHTML=`<input type="checkbox" value="${slug}"><span>${name}</span>`;const i=l.querySelector('input');i.addEventListener('change',()=>{if(i.checked){if(!state.selectedJobs.includes(slug))state.selectedJobs.push(slug)}else state.selectedJobs=state.selectedJobs.filter(v=>v!==slug);draw()});host.append(l)});PLAY_STYLES.forEach(name=>{const l=document.createElement('label');l.className='check';l.innerHTML=`<input type="checkbox" value="${name}"><span>${name}</span>`;const i=l.querySelector('input');i.addEventListener('change',()=>{if(i.checked){if(!state.selectedStyles.includes(name))state.selectedStyles.push(name)}else state.selectedStyles=state.selectedStyles.filter(v=>v!==name);renderStyles();draw()});el.playStyleChecks.append(l)})}
function renderStyles(){el.selectedPlayStyles.innerHTML='';state.selectedStyles.forEach(name=>{const chip=document.createElement('div');chip.className='tag-chip';chip.textContent=name;chip.draggable=true;chip.addEventListener('dragstart',()=>{state.dragStyle=name;chip.classList.add('dragging')});chip.addEventListener('dragend',()=>{state.dragStyle=null;chip.classList.remove('dragging')});chip.addEventListener('dragover',e=>e.preventDefault());chip.addEventListener('drop',e=>{e.preventDefault();const src=state.dragStyle;if(!src||src===name)return;const from=state.selectedStyles.indexOf(src),to=state.selectedStyles.indexOf(name);state.selectedStyles.splice(from,1);state.selectedStyles.splice(to,0,src);renderStyles();draw()});el.selectedPlayStyles.append(chip)})}
function updateOutputs(){el.scaleOutput.value=Math.round(state.characterScale*100)+'%';el.brightnessOutput.value=state.brightness+'%'}
el.characterFile.addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{state.character=img;resetCharacter();URL.revokeObjectURL(url)};img.onerror=()=>{URL.revokeObjectURL(url);alert('画像を読み込めませんでした。')};img.src=url});el.characterScale.addEventListener('input',e=>{state.characterScale=Number(e.target.value);updateOutputs();draw()});el.characterBrightness.addEventListener('input',e=>{state.brightness=Number(e.target.value);updateOutputs();draw()});el.resetCharacterButton.addEventListener('click',resetCharacter);el.mainJob.addEventListener('change',e=>{state.mainJob=e.target.value;draw()});el.dataCenter.addEventListener('change',updateWorldOptions);['race','grandCompany','baseMap','progress','playTime','loginTrend','homeWorld','creator','copyright'].forEach(id=>{const node=document.getElementById(id);node.addEventListener('input',draw);node.addEventListener('change',draw)});
let dragging=false,last={x:0,y:0};function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}canvas.addEventListener('pointerdown',e=>{if(!state.character)return;const p=pos(e),a=A.character;if(p.x<a.x||p.x>a.x+a.w||p.y<a.y||p.y>a.y+a.h)return;dragging=true;last=p;canvas.classList.add('dragging');canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!dragging)return;const p=pos(e);state.characterX+=p.x-last.x;state.characterY+=p.y-last.y;last=p;draw()});function stop(e){dragging=false;canvas.classList.remove('dragging');if(e.pointerId!==undefined&&canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId)}canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);canvas.addEventListener('wheel',e=>{if(!state.character)return;const p=pos(e),a=A.character;if(p.x<a.x||p.x>a.x+a.w||p.y<a.y||p.y>a.y+a.h)return;e.preventDefault();state.characterScale=Math.min(5,Math.max(.3,state.characterScale*(e.deltaY<0?1.05:.95)));el.characterScale.value=state.characterScale;updateOutputs();draw()},{passive:false});
el.downloadPng.addEventListener('click',async()=>{await draw();const world=(el.homeWorld.value||'character').trim().replace(/[\\/:*?"<>|\s]+/g,'-');const link=document.createElement('a');link.download=`ff14-cyberpunk-card-${world}.png`;link.href=canvas.toDataURL('image/png');link.click()});
build();template.onload=draw;preload().then(draw).catch(e=>{console.error(e);draw()});updateOutputs();
})();
</script>
